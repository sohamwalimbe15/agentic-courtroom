[project]
name = "courtroom"
version = "0.1.0"
description = "Does debate between strong LLMs help a weaker judge who cannot see the text?"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "fastapi", "uvicorn", "numpy", "matplotlib"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courtroom"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
